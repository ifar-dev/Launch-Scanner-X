name: Meme Launch Scanner

on:
  schedule:
    # Every 10 minutes. GitHub Actions cron is best-effort and can lag
    # a few minutes under load -- that's normal, not a bug.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

# Needed so the workflow can commit the updated state/seen.json file back
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scanner_gh.py

      - name: Commit updated state
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --quiet --cached || git commit -m "Update seen-tweet state [skip ci]"
          git push
